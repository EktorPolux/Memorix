<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04030a">
<meta name="description" content="Sève — un monde qui pousse en équations. Des tableaux vivants à explorer : lianes, êtres numériques, orbites musicales, flocons, récif de Collatz…">
<title>Sève — un monde qui pousse en équations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="world" aria-label="Monde procédural interactif"></canvas>

<div id="ui">
  <a id="back" class="glass-btn" href="../accueil/" aria-label="Retour à l'accueil">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="back-label">Accueil</span>
  </a>

  <div id="tools">
    <button id="btn-sound" class="glass-btn round" type="button" aria-label="Couper le son" title="Son">
      <svg class="on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <button id="btn-carnet" class="glass-btn round" type="button" aria-label="Carnet de voyage" title="Carnet de voyage">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>
      <span id="secret-count" class="badge">0</span>
    </button>
    <button id="btn-help" class="glass-btn round" type="button" aria-label="Revoir les indications" title="Indications">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.2-1.5 2.3"/><path d="M12 17.5v.01"/></svg>
    </button>
  </div>

  <div id="title-card" aria-live="polite">
    <p id="tc-kicker"></p>
    <h1 id="tc-title"></h1>
    <p id="tc-sub"></p>
    <p id="tc-hint"></p>
  </div>

  <div id="seuil">
    <p class="kicker">Procedural Playground · Tableaux vivants</p>
    <h1>Sève</h1>
    <p class="sub">un monde qui pousse en équations</p>
    <p class="call">touche la graine</p>
    <p class="note">son conseillé · souris ou doigt</p>
  </div>

  <p id="realm-label"></p>
  <div id="toasts" aria-live="polite"></div>

  <div id="carnet" role="dialog" aria-modal="true" aria-labelledby="carnet-title" hidden>
    <div class="carnet-inner">
      <header>
        <div>
          <p class="kicker">Carnet de voyage</p>
          <h2 id="carnet-title">Ce que tu as trouvé</h2>
          <p id="carnet-stats"></p>
        </div>
        <button id="carnet-close" class="glass-btn round" type="button" aria-label="Fermer le carnet">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="carnet-list"></div>
    </div>
  </div>

  <div id="eclipse" aria-hidden="true"></div>
  <div id="veil" aria-hidden="true"></div>
</div>

<noscript><p class="noscript">Sève a besoin de JavaScript pour pousser.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
